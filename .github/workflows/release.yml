name: Release (CLI)

# 推送形如 v1.2.3 的 tag 时触发：打包命令行工具源码（含双击启动器），
# 作为 GitHub Release 附件发布。纯 Python，无需为各平台单独编译。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package CLI
        run: |
          mkdir -p out/Bilimanga-Downloader
          cp -r start.py src run.command run.bat README.md README.en.md out/Bilimanga-Downloader/
          cd out
          zip -ry ../Bilimanga-Downloader-CLI.zip Bilimanga-Downloader

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: Bilimanga-Downloader-CLI.zip
          generate_release_notes: true
          body: |
            纯 Python 命令行下载器（跨平台，无需编译）。

            **前置**：本机需装有 **Python 3.9+**；下载漫画还需 **Chrome / Edge**（过 Cloudflare 用）。

            **使用**：下载 `Bilimanga-Downloader-CLI.zip` 解压后——
            - macOS：双击 `run.command`
            - Windows：双击 `run.bat`
            - 或在终端里执行：`python3 start.py`

            首次运行会自动创建项目内 `.venv` 并安装依赖。进入后粘贴漫画或轻小说网址（自动识别类型），方向键勾选要下的卷即可。下载默认存到系统下载目录 `~/Downloads`，可用 `--out <目录>` 指定。
